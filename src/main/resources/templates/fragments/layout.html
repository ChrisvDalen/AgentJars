<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · AgentJars'">AgentJars</title>
  <meta name="description"
        content="AgentJars is a registry of agent definitions packaged as jars and published to Maven Central.">
  <link rel="stylesheet" th:href="@{/css/agentjars.css}">
  <link rel="icon" th:href="@{/img/jar.svg}" type="image/svg+xml">
</head>
<body>

<header class="site-header" th:fragment="header(active)">
  <div class="shell">
    <a class="brand" th:href="@{/}">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8 2h8M7.5 5h9M6.5 8.2c0-.9.7-1.7 1.6-1.9l.9-.2h6l.9.2c.9.2 1.6 1 1.6 1.9V19a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3V8.2Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M6.5 13.5c2-1 3.5 1 5.5 0s3.5-1 5.5 0" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"/>
      </svg>
      AgentJars
    </a>
    <nav class="site-nav">
      <a th:href="@{/agents}" th:classappend="${active == 'browse'} ? 'active'">Browse</a>
      <a th:href="@{/docs}" th:classappend="${active == 'docs'} ? 'active'">Docs</a>
      <a th:href="@{/deploy}" th:classappend="${active == 'deploy'} ? 'active'">Publish</a>
      <a href="https://github.com/ChrisvDalen/AgentJars" rel="noopener">Source</a>
    </nav>
  </div>
</header>

<footer class="site-footer" th:fragment="footer">
  <div class="shell">
    <span>AgentJars — agent definitions, versioned and resolved by your build tool.</span>
    <nav>
      <a th:href="@{/docs}">Docs</a>
      <a th:href="${staticSite} ? @{/api/agents.json} : @{/api/agents}">API</a>
      <a th:href="@{/deploy}">Publish</a>
    </nav>
  </div>
</footer>

<div th:fragment="agent-card(agent)" class="card"
     data-agent
     th:attr="data-search=${#strings.toLowerCase(agent.displayName() + ' ' + agent.artifactId() + ' ' + agent.description() + ' ' + (agent.sourceRepo() ?: '') + ' ' + #strings.listJoin(agent.tags(), ' '))},
              data-tags=${#strings.toLowerCase(#strings.listJoin(agent.tags(), ' '))}">
  <h3><a th:href="@{'/agents/' + ${agent.artifactId()}}" th:text="${agent.displayName()}">Agent</a></h3>
  <span class="artifact" th:text="${agent.artifactId()}">artifact</span>
  <p th:text="${agent.description()}">Description</p>
  <div class="meta">
    <span class="tag" th:each="tagName : ${agent.tags()}" th:text="${tagName}">tag</span>
    <span class="tag" th:if="${agent.latestVersion() != null}"
          th:text="${agent.latestVersion()}">version</span>
  </div>
</div>

<script th:fragment="snippet-script">
  document.addEventListener('click', (event) => {
    const tab = event.target.closest('.snippet-tabs button');
    if (tab) {
      const snippet = tab.closest('.snippet');
      snippet.querySelectorAll('.snippet-tabs button')
        .forEach((button) => button.setAttribute('aria-selected', String(button === tab)));
      snippet.querySelectorAll('pre[data-tool]')
        .forEach((pre) => { pre.hidden = pre.dataset.tool !== tab.dataset.tool; });
      return;
    }

    const copy = event.target.closest('[data-copy]');
    if (copy) {
      const snippet = copy.closest('.snippet');
      const visible = snippet.querySelector('pre[data-tool]:not([hidden])') || snippet.querySelector('pre');
      navigator.clipboard.writeText(visible.textContent.trim()).then(() => {
        const original = copy.textContent;
        copy.textContent = 'copied';
        setTimeout(() => { copy.textContent = original; }, 1200);
      });
    }
  });
</script>

</body>
</html>
